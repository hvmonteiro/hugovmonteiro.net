{{/* Header */}}

<div class="header">

    {{ if or (not (.Param "hideHeader")) .IsHome }}

    <h1 class="header-title">
        <a href="{{ site.BaseURL }}">{{ site.Title | safeHTML }}</a>
    </h1>

    <h2 class="header-description">{{ site.Params.Description }}</h2>

    <nav class="header-menu" aria-label="Main navigation">
        {{ $currentPage := . }}

        {{ with site.Params.menu }}
        {{ range . }}
        {{ $active := eq .url $currentPage.RelPermalink }}
        <p class="small{{ if $active }} bold{{ end }}">
            <a href="{{ .url }}"{{ if $active }} aria-current="page"{{ end }}{{ if and (isset . "newTab") .newTab }} target="_blank" rel="noopener noreferrer"{{ end }}>
                /{{ .name | safeHTML }}
            </a>
        </p>
        {{ end }}
        {{ end }}
    </nav>

    {{ end }}

</div>
