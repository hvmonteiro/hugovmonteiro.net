
{{/* Social links */}}

{{ with site.Params.social }}
<div class="social-icons">
    {{- range $index, $social := . -}}
    {{- if gt $index 0 }}<span class="social-separator" aria-hidden="true"> · </span>{{ end -}}
    <a href="{{ trim $social.url " " | safeURL }}" target="_blank"
        rel="noopener noreferrer me"
        title="{{ $social.title | default $social.name }}">{{ $social.name }}</a>
    {{- end }}
</div>
{{ end }}
