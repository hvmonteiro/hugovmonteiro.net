
{{/* Social links */}}

{{ with site.Params.social }}
<div class="social-icons">
    {{- range . }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank"
        rel="noopener noreferrer me"
        title="{{ .title | default .name }}">
        {{ .name }}
    </a>
    {{- end }}
</div>
{{ end }}
