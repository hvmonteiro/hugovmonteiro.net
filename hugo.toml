baseURL = 'https://www.hugovmonteiro.net/'
languageCode = 'en-us'
title = 'hugo V monteiro'

# Google analytics code
#googleAnalytics = "G-xxxxxxxxx"

[module]
[[module.imports]]
path = "github.com/tomfran/typo"

[taxonomies]
tag = 'tags'

[params]
faviconPath = '/images'
# Meta description
description = 'Technology, people, and ideas from a curious mind.'

# Appearance settings
theme = 'light'                    # 'auto | light | dark'
colorPalette = 'default'           # https://tomfran.github.io/typo-wiki/features/appearance/
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = "Hi, I'm Hugo."
homeIntroContent = """
{{< figure src="/images/home.png" class="figure" >}}

I'm Hugo Monteiro, a **technologist**, **solution designer**, and **systems architect** based in Lisbon, Portugal. For more than 25 years, I've worked across IT and R&D, connecting business needs with technology that teams can build, run, and improve.

My work increasingly centers on **technology leadership**: making clear architecture decisions, bringing people together, and helping complex ideas become useful systems. I'm also preparing the next stage of my path as a **speaker** and future **startup mentor**. The mentoring plan is still being defined and will be based on what I have learned in fast-paced corporate R&D teams about scalable systems, long-term thinking, people, and delivery.

**Explore:** [Technology Leadership](/technology-leadership/) · [Startup Mentoring](/startup-mentoring/) · [About me](/about/) · [Tech Corner](/tech-corner/) · [Writings](/writings/)

Outside work, I'm a musician, a hands-on maker, a motorcycle enthusiast, and a curious writer. You'll find more of that side of me on the [About page](/about/), through [my music](https://www.hugovmonteiro.com), and at [Intriguing Mind](https://intriguingmind.substack.com/).
"""

# Collection to display on home
#homeCollectionTitle = 'writings'
#homeCollection = 'home'

# Content Directory
contentDir = "content"

# Lists parameters
paginationSize = 15
paginationTagsSize = 50
listSummaries = true # List summary OR first block of content of all articles
listDateFormat = '2 Jan 2006'
showListDate = true

#showFooter = true
footerContent = "_Copyright_ © 2026 _Hugo Monteiro_"

# Mermaid Diagrams
#mermaidTheme = "neutral"
[markup.goldmark.renderer]
unsafe = true


# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = false # Set to false to hide the last crumb, i.e, the current page.
home = "~"

