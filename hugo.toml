baseURL = 'https://www.hugovmonteiro.net/'
languageCode = 'en-us'
title = 'hugo v monteiro'

# Google analytics code
#googleAnalytics = "G-xxxxxxxxx"

[module]
[[module.imports]]
path = "github.com/tomfran/typo"

[taxonomies]
tag = 'tags'

[params]
faviconPath = '/images'
# Meta description
description = 'Technology, people, and ideas from a curious mind.'

# Appearance settings
theme = 'light'                    # 'auto | light | dark'
colorPalette = 'default'           # https://tomfran.github.io/typo-wiki/features/appearance/
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = "Hi, I'm Hugo."
homeIntroContent = """
{{< figure src="/images/home.png" class="figure" >}}

I’m Hugo Monteiro, a technologist, engineering leader, solutions designer, and systems architect based in Lisbon, Portugal. For more than 25 years, I’ve worked across IT, R&D, and ERP, with uncommon vertical experience and know-how in technology business, connecting business needs with technology.

My work is centered on *technology leadership*: making clear architecture decisions, *bridging the gap between business and technical teams*, and helping complex ideas become useful systems. Also interested in *public speaking*, *startup ecosystem*, *mentoring* and *exploring product ideas*. Some directions are still being defined while others are already being explored, but all are based on what I have learned in fast-paced corporate R&D multinational teams about scalable systems, long-term thinking, people, and delivery.

Outside work, I’m a musician, a DIY hands-on maker, a motorcycle enthusiast, and a curious writer. You’ll find more of that side of me on the [About page](/about/), through [my music](https://www.hugovmonteiro.com), and at <a href="https://intriguingmind.substack.com/" target="_blank" rel="noopener noreferrer">Intriguing Mind</a>.
"""

# Collection to display on home
#homeCollectionTitle = 'writings'
#homeCollection = 'home'

# Content Directory
contentDir = "content"

# Lists parameters
paginationSize = 15
paginationTagsSize = 50
listSummaries = true # List summary OR first block of content of all articles
listDateFormat = '2 Jan 2006'
showListDate = true

#showFooter = true
footerContent = "_Copyright_ © 2026 _Hugo Monteiro_"

# Mermaid Diagrams
#mermaidTheme = "neutral"
[markup.goldmark.renderer]
unsafe = true


# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = false # Set to false to hide the last crumb, i.e, the current page.
home = "~"

